name: CI

on:
  push:
    branches: [main]
  pull_request:

  # The TestFlight job below is manual, which needs this to exist: a job
  # gated on an event the workflow does not listen to never runs, and
  # nothing reports that — it is simply absent from every run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The app's database tests run on the host VM, so they need a system
      # sqlite rather than the one sqlite3_flutter_libs bundles for devices.
      - name: Install sqlite
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0

      - name: Resolve workspace
        run: flutter pub get

      - name: Check generated code is current
        run: |
          # gen-l10n must run inside the app package: from the workspace root it
          # reads the root pubspec, finds no `generate: true`, and does nothing.
          cd app
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          cd ..
          if ! git diff --exit-code -- '*.g.dart' 'app/lib/l10n'; then
            echo "::error::Generated code is stale. Run tool/generate.ps1 and commit the result."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test pure Dart packages
        run: |
          for pkg in pose_core exercise_library coach_engine plan_engine harness; do
            if ls packages/$pkg/test/*_test.dart >/dev/null 2>&1; then
              echo "::group::dart test $pkg"
              (cd packages/$pkg && dart test --reporter expanded)
              echo "::endgroup::"
            else
              echo "no tests yet in $pkg, skipping"
            fi
          done

      - name: Test Flutter packages
        run: |
          (cd app && flutter test)
          (cd packages/pose_camera && flutter test)

      # The gate tool/check.ps1 has run since M5, finally wired in here. It
      # fails on a miscounted rep and on a form rule that disagrees with a
      # fixture's label in either direction — a rule that misses its fault
      # is useless, and one that fires on good form will fire on every set
      # anybody ever performs.
      - name: Accuracy harness
        run: cd packages/harness && dart run bin/harness.dart

  # Everything below needs a Mac, which is why none of it existed before M9:
  # this project is developed on Windows, where iOS cannot be built at all.
  # These jobs are the first thing that will ever compile the Swift.
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      # No signing: this proves the code compiles and links, which is the
      # question. Shipping it anywhere needs an Apple developer account and
      # the secrets below.
      - name: Build iOS
        run: cd app && flutter build ios --no-codesign

      # Compiles the XCTest target without running it. Worth its own step
      # because the landmark ordinal table is resolved by the compiler: a
      # constant ML Kit does not have is a build failure here rather than a
      # joint that silently never arrives.
      - name: Compile the native tests
        run: |
          cd app/ios
          xcodebuild build-for-testing \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

  # Split from the build because ML Kit ships no arm64 simulator slice, so
  # the tests cannot run on an Apple Silicon runner at all. macos-15-intel
  # is the last x86_64 macOS image GitHub offers and it retires in Fall
  # 2027, after which this has to move to a real device.
  ios-test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      # Builds the iOS app once so that the Podfile is resolved and
      # Generated.xcconfig exists; xcodebuild cannot do either itself.
      - name: Prepare the Xcode workspace
        run: cd app && flutter build ios --simulator

      # The destination is whatever simulator this image's Xcode shipped
      # with, asked for rather than assumed. A named model that the image
      # does not have fails the build, which is survivable; a named model
      # that resolves to something unintended does not, which is not.
      - name: Run the native tests
        run: |
          cd app/ios
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "::error::no iPhone simulator on this runner image"
            exit 1
          fi
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=$udid" \
            -only-testing:RunnerTests

  # Manual, and fails fast without the secrets, because shipping to
  # TestFlight needs an Apple developer account and this project may not
  # have one yet. The pipeline exists so that the day it does, the answer is
  # a button rather than a week.
  testflight:
    if: github.event_name == 'workflow_dispatch'
    needs: [analyze-and-test, ios-build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check the secrets are here
        run: |
          if [ -z "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" ]; then
            echo "::error::TestFlight needs APP_STORE_CONNECT_KEY_ID, "\
              "APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY, "\
              "IOS_CERTIFICATE_P12 and IOS_PROVISIONING_PROFILE."
            exit 1
          fi

      - name: Resolve workspace
        run: flutter pub get

      - name: Install the signing identity
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          echo "$CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          echo "$PROFILE" | base64 --decode > /tmp/profile.mobileprovision

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build the archive
        run: cd app && flutter build ipa --export-method app-store

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$PRIVATE_KEY" | base64 --decode > ~/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app --type ios \
            --file app/build/ios/ipa/*.ipa \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
